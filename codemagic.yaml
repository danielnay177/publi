workflows:
  publi-ios-testflight:
    name: Publi iOS TestFlight
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: "JDPrep Codemagic"
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.publi.app
      vars:
        XCODE_WORKSPACE: ios/publi.xcworkspace
        XCODE_SCHEME: publi
      node: 20
    scripts:
      - name: Install JavaScript dependencies
        script: npm ci
      - name: Generate iOS project
        script: npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods dependencies
        script: pod install --project-directory=ios
      - name: Apply App Store signing profile
        script: xcode-project use-profiles
      - name: Build signed IPA
        script: xcode-project build-ipa --workspace "$XCODE_WORKSPACE" --scheme "$XCODE_SCHEME" --config Release
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/**/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups: []
